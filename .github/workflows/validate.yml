name: Validate solutions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  POWERSHELL_TELEMETRY_OPTOUT: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  AZURE_CORE_COLLECT_TELEMETRY: 0
  BICEP_CLI_TELEMETRY_OPTOUT: 1

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test dependencies
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.6') { throw 'PowerShell 7.6 or newer is required.' }
          Write-Host "Validation PowerShell: $($PSVersionTable.PSVersion)"
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force
      - name: Require compiled ARM preservation contracts
        run: |
          az bicep install --version v0.42.1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Bicep installation failed.' }
          $azureConfigDir = if ($env:AZURE_CONFIG_DIR) { $env:AZURE_CONFIG_DIR } else { Join-Path $HOME '.azure' }
          $bicepPath = Join-Path $azureConfigDir 'bin/bicep'
          if (-not (Test-Path -LiteralPath $bicepPath)) { throw 'Bicep CLI was not found after installation.' }
          "BICEP_EXE=$bicepPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run repository tests
        run: |
          Import-Module Pester -RequiredVersion 6.2.0 -Force
          Write-Host "Validation Pester: $((Get-Module Pester).Version)"
          Invoke-Pester -Path ./tests -CI
      - name: Qualify actual locked Maester 2.3.0 results offline
        run: |
          # Reuse production verification/import logic and reviewed package locks.
          $tokens = $null; $errors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./scripts/Invoke-MaesterAutomationRunbook.ps1), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw 'Runbook parse failed.' }
          $lock = $ast.Find({ param($node) $node -is [Management.Automation.Language.AssignmentStatementAst] -and $node.Left.Extent.Text -ceq '$runtimePackages' }, $true).Right.Expression.SafeGetValue()
          $import = $ast.Find({ param($node) $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -ceq 'Import-LockedRuntimeModule' }, $true)
          . ([scriptblock]::Create($import.Extent.Text))
          $moduleRoot = Join-Path ([IO.Path]::GetTempPath()) "maester-ci-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $moduleRoot | Out-Null
          $env:PSModulePath = "$moduleRoot$([IO.Path]::PathSeparator)$env:PSModulePath"
          try {
            Import-LockedRuntimeModule -Name Pester -PackageLock $lock -DestinationRoot $moduleRoot
            Import-LockedRuntimeModule -Name Microsoft.Graph.Authentication -PackageLock $lock -DestinationRoot $moduleRoot
            $maester = Import-LockedRuntimeModule -Name Maester -PackageLock $lock -DestinationRoot $moduleRoot -PassThru
            ./tests/Invoke-Maester230Compatibility.ps1 -MaesterManifest (Join-Path $maester.ModuleBase 'Maester.psd1')
          } finally { Remove-Item -LiteralPath $moduleRoot -Recurse -Force }
      - name: Parse PowerShell
        run: |
          $errors = @()
          Get-ChildItem -Path . -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$fileErrors) | Out-Null
            $errors += @($fileErrors)
          }
          if ($errors.Count) { throw ($errors | Out-String) }
